    <!-- Structured Data 2: FAQPage Schema (Displays expandable rich snippets in Google Search) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "How does CollegeBook verify that only real college students join?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Students sign up with their institutional college email (e.g., student@university.edu) or select their verified campus from our comprehensive database of colleges and universities. Every profile is anchored to their authentic university identity."
          }
        },
        {
          "@type": "Question",
          "name": "Why are likes anonymous on posts in CollegeBook?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Likes are anonymous so that any student can appreciate a post freely without hesitation, anxiety, or social pressure. You can simply support what your peers share with complete peace of mind."
          }
        },
        {
          "@type": "Question",
          "name": "How does the Collab Hub team building and communication work?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "When a project creator posts a team opening with required skills, prospective members submit a structured join request outlining their intent and experience. Once accepted, a private, dedicated team chat room is unlocked."
          }
        },
        {
          "@type": "Question",
          "name": "What is myCon and how are skill badges validated on CollegeBook?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Unlike conventional platforms where anyone can add self-proclaimed skills without proof, myCon verifies authentic credentials by connecting to public coding profiles or verified competition proofs."
          }
        },
        {
          "@type": "Question",
          "name": "What happens to my CollegeBook account when I graduate?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "CollegeBook accounts are intentionally time-bound to your degree program duration. Upon graduation, all your posts, team records, and validated achievements are compiled into a downloadable Digital Memory Book that you keep forever."
          }
        },
        {
          "@type": "Question",
          "name": "Is CollegeBook free for students?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, CollegeBook is a 100% student-focused platform and completely free for all college and university students."
          }
        }
      ]
    }
    </script>

  <body>
    <div id="root">
      <!-- Branded instantaneous preloader displayed while React bundle is loading -->
      <div style="min-height: 100vh; width: 100vw; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #ffffff; margin: 0; padding: 0;">
        <style>
          @keyframes cb-logo-breathe {
            0%, 100% {
              transform: scale(0.88);
              opacity: 0.85;
            }
            50% {
              transform: scale(1.12);
              opacity: 1;
            }
          }
          @keyframes cb-aura-pulse {
            0%, 100% {
              transform: scale(0.85);
              opacity: 0.2;
            }
            50% {
              transform: scale(1.2);
              opacity: 0.5;
            }
          }
          .cb-splash-container {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100px;
            height: 100px;
          }
          .cb-splash-aura {
            position: absolute;
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: rgba(37, 99, 235, 0.2);
            filter: blur(18px);
            animation: cb-aura-pulse 1.6s infinite ease-in-out;
            pointer-events: none;
          }
          .cb-splash-logo {
            position: relative;
            z-index: 10;
            width: 68px;
            height: 68px;
            object-fit: contain;
            border-radius: 18px;
            box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.3);
            animation: cb-logo-breathe 1.6s infinite ease-in-out;
          }
        </style>
        <div class="cb-splash-container">
          <div class="cb-splash-aura"></div>
          <img src="/logo.png" alt="CollegeBook" class="cb-splash-logo" onerror="this.style.display='none'; document.getElementById('cb-fallback-logo').style.display='flex';" />
          <div id="cb-fallback-logo" class="cb-splash-logo" style="display: none; background: linear-gradient(135deg, #2563eb, #7c3aed); align-items: center; justify-content: center;">
            <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/>
              <path d="M6 6h10"/>
              <path d="M6 10h10"/>
            </svg>
          </div>
        </div>
      </div>
    </div>
    <noscript>

    </noscript>

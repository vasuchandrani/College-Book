spring:
  application:
    name: collegebook-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL:jdbc:postgresql://ep-patient-frog-az9fnpft.c-3.ap-southeast-1.aws.neon.tech/neondb?sslmode=require&stringtype=unspecified}
    username: ${DB_USER:neondb_owner}
    password: ${DB_PASSWORD:npg_sTDYl67hcznI}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL:5}
      minimum-idle: 1
      idle-timeout: 60000
      connection-timeout: 30000
      validation-timeout: 5000
      max-lifetime: 120000
      keepalive-time: 30000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false

  data:
    redis:
      repositories:
        enabled: false
      host: ${REDIS_HOST:exact-thrush-140580.upstash.io}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASS:gQAAAAAAAiUkAAIgcDJlYzU4ZTA5MDdmNjY0NDczODY2ZmRlZDUxNWUzZDI4OA}
      ssl:
        enabled: true

  mail:
    host: ${MAIL_HOST:smtp-relay.brevo.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USER:}
    password: ${MAIL_PASS:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  secret: ${JWT_SECRET:c29tZS1zdXBlci1zZWNyZXQta2V5LXRoYXQtaXMtYXQtbGVhc3QtMjU2LWJpdHMtbG9uZy0xMjM0NTY3ODkw}
  access-token-expiration-minutes: 15
  refresh-token-expiration-days: 30

brevo:
  api-key: ${BREVO_API_KEY:YOUR_BREVO_API_KEY}
  sender-email: ${BREVO_SENDER_EMAIL:collegebook.team@gmail.com}
  sender-name: ${BREVO_SENDER_NAME:CollegeBook}

storage:
  active-provider: ${STORAGE_ACTIVE_PROVIDER:S3}

aws:
  s3:
    region: ${AWS_S3_REGION:eu-north-1}
    access-key-id: ${AWS_S3_ACCESS_KEY_ID:YOUR_AWS_ACCESS_KEY_ID}
    secret-access-key: ${AWS_S3_SECRET_ACCESS_KEY:YOUR_AWS_SECRET_ACCESS_KEY}
    bucket-name: ${AWS_S3_BUCKET_NAME:collegebook-media-240704557167-eu-north-1-an}
    public-url: ${AWS_S3_PUBLIC_URL:}

cloudflare:
  r2:
    account-id: ${R2_ACCOUNT_ID:}
    access-key-id: ${R2_ACCESS_KEY_ID:}
    secret-access-key: ${R2_SECRET_ACCESS_KEY:}
    bucket-name: ${R2_BUCKET_NAME:}
    endpoint: ${R2_ENDPOINT:}
    public-url: ${R2_PUBLIC_URL:}
  stream:
    account-id: ${CLOUDFLARE_ACCOUNT_ID:}
    api-token: ${CLOUDFLARE_STREAM_API_TOKEN:}

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5000}
  otp:
    bypass: ${APP_OTP_BYPASS:false}
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:5000}
  ads:
    every-n-posts: 5
  social:
    sync-interval-ms: ${SOCIAL_SYNC_INTERVAL_MS:15000}
    feed-cache-ttl-seconds: ${FEED_CACHE_TTL_SECONDS:30}
    collab-cache-ttl-seconds: ${COLLAB_CACHE_TTL_SECONDS:60}
    interaction-ttl-hours: ${INTERACTION_TTL_HOURS:168}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

server:
  port: ${PORT:8080}
  tomcat:
    threads:
      max: 20
      min-spare: 2

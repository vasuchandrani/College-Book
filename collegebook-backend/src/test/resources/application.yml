spring:
  application:
    name: collegebook-backend-test

  datasource:
    url: ${DB_URL:jdbc:postgresql://ep-patient-frog-az9fnpft.c-3.ap-southeast-1.aws.neon.tech/neondb?sslmode=require&stringtype=unspecified}
    username: ${DB_USER:neondb_owner}
    password: ${DB_PASSWORD:npg_sTDYl67hcznI}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false

  flyway:
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASS:}
      ssl:
        enabled: false

jwt:
  secret: ${JWT_SECRET:dGVzdC1zZWNyZXQta2V5LXRoYXQtaXMtYXQtbGVhc3QtMjU2LWJpdHMtbG9uZy0xMjM0NQ==}
  access-token-expiration-minutes: 15
  refresh-token-expiration-days: 30

email:
  active-provider: ${EMAIL_ACTIVE_PROVIDER:BREVO}

brevo:
  api-key: ${BREVO_API_KEY:test-brevo-key}
  sender-email: ${BREVO_SENDER_EMAIL:test@collegebook.live}
  sender-name: ${BREVO_SENDER_NAME:CollegeBook}

storage:
  active-provider: ${STORAGE_ACTIVE_PROVIDER:S3}

aws:
  s3:
    region: ${AWS_S3_REGION:eu-north-1}
    access-key-id: ${AWS_S3_ACCESS_KEY_ID:test-key}
    secret-access-key: ${AWS_SECRET_ACCESS_KEY:test-secret}
    bucket-name: ${AWS_S3_BUCKET_NAME:test-bucket}
  ses:
    region: ${AWS_SES_REGION:${AWS_S3_REGION:eu-north-1}}
    access-key-id: ${AWS_SES_ACCESS_KEY_ID:test-key}
    secret-access-key: ${AWS_SES_SECRET_ACCESS_KEY:test-secret}
    sender-email: ${AWS_SES_SENDER_EMAIL:test@collegebook.live}
    sender-name: ${AWS_SES_SENDER_NAME:CollegeBook}

app:
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:Admin@CollegeBook2026}
  otp:
    bypass: false
  cors:
    allowed-origins: "*"
